<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -90 1440 750" width="1440" height="750" font-family="Helvetica, Arial, sans-serif">
<title>Health check, as an EPC</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#111" stroke-width="1.6"/></marker></defs>
<rect x="-30" y="-90" width="1440" height="750" fill="#fff"/>
<text x="0" y="-25" font-size="48" font-weight="bold" fill="#111">Health check, as an EPC</text>
<text x="0" y="30" font-size="28" fill="#111">One click, one database check, one of two answers.</text>
<text font-size="16" fill="#111"><tspan x="0" y="285" font-weight="bold">Hexagon</tspan>: something happened (event)</text>
<text font-size="16" fill="#111"><tspan x="0" y="309" font-weight="bold">Rounded box</tspan>: something is done (function)</text>
<text font-size="16" fill="#111"><tspan x="0" y="333" font-weight="bold">Oval</tspan>: the flow splits or joins (XOR, one path only)</text>
<text font-size="14" fill="#333"><tspan x="0" y="430">Code names: health_view (view), check_health (service).</tspan><tspan x="0" y="450">Traced by spadetrack as Health view &gt; Check health.</tspan></text>
<polygon points="30,95 160,95 190,140 160,185 30,185 0,140" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="95" y="145">Person clicks Check</tspan></text>
<rect x="254" y="95" width="190" height="90" rx="14" fill="#72cf72" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="349" y="135">Send request</tspan><tspan x="349" y="155">Vue to /api/health/</tspan></text>
<polygon points="538,95 668,95 698,140 668,185 538,185 508,140" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="603" y="145">Request received</tspan></text>
<rect x="762" y="95" width="190" height="90" rx="14" fill="#72cf72" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="857" y="135">Check health</tspan><tspan x="857" y="155">check_health()</tspan></text>
<ellipse cx="1071" cy="140" rx="55" ry="45" fill="#d4d4d4" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="1071" y="145">XOR</tspan></text>
<polygon points="792,255 922,255 952,300 922,345 792,345 762,300" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="857" y="305">Database answers</tspan></text>
<polygon points="1220,255 1350,255 1380,300 1350,345 1220,345 1190,300" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="1285" y="305">Database unavailable</tspan></text>
<rect x="762" y="405" width="190" height="90" rx="14" fill="#72cf72" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="857" y="445">Respond 200</tspan><tspan x="857" y="465">status: ok</tspan></text>
<ellipse cx="1071" cy="450" rx="55" ry="45" fill="#d4d4d4" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="1071" y="455">XOR</tspan></text>
<rect x="1190" y="405" width="190" height="90" rx="14" fill="#72cf72" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="1285" y="445">Respond 503</tspan><tspan x="1285" y="465">status: degraded</tspan></text>
<polygon points="1006,545 1136,545 1166,590 1136,635 1006,635 976,590" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="1071" y="595">Response sent</tspan></text>
<rect x="722" y="545" width="190" height="90" rx="14" fill="#72cf72" stroke="#33415c" stroke-width="1.5"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="817" y="585">Show result</tspan><tspan x="817" y="605">Health page</tspan></text>
<polygon points="498,545 628,545 658,590 628,635 498,635 468,590" fill="#6aa9ee" stroke="#33415c" stroke-width="1.5" stroke-linejoin="round"/>
<text text-anchor="middle" font-size="16" fill="#111"><tspan x="563" y="595">Status shown</tspan></text>
<polyline points="190,140 254,140" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="444,140 508,140" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="698,140 762,140" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="952,140 1016,140" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1071,185 1071,220 857,220 857,255" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1071,185 1071,220 1285,220 1285,255" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="857,345 857,405" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1285,345 1285,405" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="952,450 1016,450" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1190,450 1126,450" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="1071,495 1071,545" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="976,590 912,590" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
<polyline points="722,590 658,590" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/>
</svg>
